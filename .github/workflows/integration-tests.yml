      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.3'

    - name: Run CockroachDB integration tests
      run: make test-cockroachdb
      timeout-minutes: 10

  integration-tests-clickhouse:
    name: ClickHouse Integration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.3'

    - name: Run ClickHouse integration tests
      run: make test-clickhouse
      timeout-minutes: 10

  integration-tests-mssql:
    name: MSSQL Integration
    runs-on: ubuntu-latest

    steps:
